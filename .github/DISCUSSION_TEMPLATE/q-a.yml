title: "[区分] "
body:
  - type: markdown
    attributes:
      value: |
        算定の疑問をお寄せください。ほかの利用者や KaiTech がわかる範囲でお答えします。
        ここでのやり取りは、厚生労働省や審査支払機関の公式な見解ではありません。
        患者さんの情報や、医療機関を特定できる情報は書き込まないでください。
  - type: input
    id: kubun
    attributes:
      label: 区分
      description: 例 A000 初診料（ファイルの URL でも構いません）
  - type: textarea
    id: question
    attributes:
      label: 疑問
      description: どんな場面で、どこの読み方に迷っているか
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 調べたこと
      description: 参照した通知・疑義解釈、ご自身の考えなど（任意）
  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: 患者さんや医療機関を特定できる情報を含んでいません
          required: true
