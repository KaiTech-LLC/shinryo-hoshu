title: "[区分] 査定の内容"
body:
  - type: markdown
    attributes:
      value: |
        **個人情報は書かないでください。**
        患者さんの氏名・生年月日・保険者番号、医療機関名、レセプトの画像など、患者さんや医療機関を特定できる情報は書き込まないでください。
        年齢は「70代」、時期は「2026年9月診療分」のように、ぼかして書いてください。
  - type: input
    id: kubun
    attributes:
      label: 区分
      description: 例 D007 血液化学検査
    validations:
      required: true
  - type: dropdown
    id: shinsa
    attributes:
      label: 審査機関
      options:
        - 社会保険診療報酬支払基金
        - 国民健康保険団体連合会
        - わからない
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 種類
      options:
        - 査定（減点）
        - 返戻
        - 再審査請求の結果
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: 時期
      description: 例 2026年9月診療分
  - type: input
    id: ka
    attributes:
      label: 診療科・入院／外来
      description: 例 内科・外来（任意）
  - type: textarea
    id: detail
    attributes:
      label: 査定の内容と理由
      description: 何が何点（何回）減ったか。増減点連絡書の事由（A〜D など）がわかれば添えてください
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 請求の背景
      description: 付けていた病名、算定の回数、併算定していた項目など（個人を特定できない範囲で）
  - type: textarea
    id: after
    attributes:
      label: その後の対応
      description: 再審査請求の結果や、次回から変えたことなど（任意）
  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: 患者さんや医療機関を特定できる情報を含んでいません
          required: true
